name: Go CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Format check
        run: |
          set -euo pipefail
          gofmt -d ./cmd ./internal
          unformatted="$(gofmt -l ./cmd ./internal)"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Test
        run: go test ./...
      - name: Test (race)
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build static binary
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/pve-zfs-monitor ./cmd/pve-zfs-monitor
      - name: Install script syntax
        run: bash -n scripts/install.sh
      - name: Release signing script syntax
        run: |
          set -euo pipefail
          for s in release/signing/*.sh; do
            bash -n "$s"
          done
